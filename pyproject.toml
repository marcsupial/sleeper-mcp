[project]
name = "sleeper-mcp"
version = "0.1.0"
description = "Read-only MCP server for Sleeper fantasy football leagues and lineups"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.9",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.12",
]

[project.scripts]
sleeper-mcp = "sleeper_mcp:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "types-jsonschema>=4.25",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
