name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, the development version, and the newest CPython, which uv
        # picks for Claude Desktop bundle users.
        python-version: ["3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  bundle:
    name: MCPB bundle
    runs-on: ubuntu-latest
    # This job builds the release asset, so it restores no caches and keeps no git credentials.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: uv sync --locked
      # Packs a copy without the dev group, then installs it with `uv sync --locked`.
      - run: uv run python scripts/build_mcpb.py --check-install
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: dist/*.mcpb
          if-no-files-found: error

  attach:
    name: Attach bundle to release
    if: github.event_name == 'release'
    needs: [check, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcpb
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Refuse a tag that doesn't match the bundle's version, e.g. v0.2.0 for 0.1.0.
          bundle="dist/sleeper-mcp-${TAG#v}.mcpb"
          if [ ! -f "$bundle" ]; then
            echo "::error::$TAG does not match the built bundle: $(ls dist)"
            exit 1
          fi
          gh release upload "$TAG" "$bundle" --clobber --repo "$GITHUB_REPOSITORY"
